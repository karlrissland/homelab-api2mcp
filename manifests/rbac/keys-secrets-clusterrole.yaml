# Legacy delivery RBAC. Centralized agent-key storage now uses
# agent-keys-role.yaml in the gateway namespace; new installations do not need
# this ClusterRole bound in agent namespaces. Retained for older deployments.
#
# Grants mcp2rest's ServiceAccount write access to the per-agent-instance
# key Secrets it mints and delivers (internal/keys.SecretWriter).
#
# Per docs/decisions/mcp2rest-plan.md Open Decision 6: Kubernetes RBAC
# cannot restrict access by Secret *name* pattern, only by namespace/label.
# This is therefore a deliberately broad-but-namespace-scoped ClusterRole
# for v1 ("ship working, harden later") rather than a dynamically
# provisioned per-namespace Role/RoleBinding at registration time. Revisit
# toward per-namespace least-privilege once real usage is known.
#
# Namespace scoping (restricting this ClusterRole to only namespaces that
# already carry an agent-instance label) is applied via the
# ClusterRoleBinding's subjects/namespaceSelector at deploy time in
# `homelab` (see homelab#216) — this ClusterRole only declares the verbs,
# not the namespace scope, since ClusterRole itself is namespace-agnostic
# by definition.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp2rest-keys-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
